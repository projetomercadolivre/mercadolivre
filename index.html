<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <title>Document</title>
</head>
<body>
        <header id="topo">
            <div id="logo">
                <a href="#">
                    <img src="src/assets/logo.jpeg" alt="Logo Mercado Livro">
                </a>
            </div>

            <!-- Área de busca -->
            <search id="busca">
                <form role="search">
                    <input type="text" id="busca-input" placeholder="Digite sua busca">
                </form>
            </search>

            <nav id="menu">
                <a href="#">Crie sua Conta</a>
                <a href="#">Entre</a>
                <a href="#">Compras</a>
                <a href="#" label="Carrinho de compras">
                    <img src="./src/assets/carrinho.png" alt="Ícone do carrinho">
                </a>

                <!-- Botão de Alternância de Tema (Dark/Light) -->
                <div class="theme">
                    <input type="checkbox" id="dark" class="check">
                    <label for="dark" class="theme-label" title="Alternar tema"><img src="./src/assets/darkMode.png"></label>
                </div>
            </nav>
        </header>
    
    <script src="./src/js/script.js"></script>
</body>
</html>
